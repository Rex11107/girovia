<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Girovia</title>
<meta name="description" content="Mezzi pubblici, auto e piedi per Firenze e la Toscana. Senza pubblicità e senza tracciamento.">
<meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11171c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Girovia">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
/* Font inclusi nell'app (licenza SIL OFL): nessuna richiesta a Google Fonts */
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
/* Layout: mappa a tutto schermo, pannello di ricerca in alto, foglio scorrevole in basso (stile segnaletica di fermata) */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --surface-2:#eef1f4; --line:#d9dfe5;
  --fg:#14202b; --muted:#5b6876; --accent:#0d6e63; --accent-fg:#ffffff;
  --walk:#6b7783; --car:#2457c5; --transit:#b3261e; --warn:#b15c00; --ok:#1f7a3a; --bad:#b3261e;
  --shadow:0 6px 24px rgba(20,32,43,.14);
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-sign:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --sheet-h:34vh;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11171c; --surface:#1a2228; --surface-2:#232d35; --line:#33404a;
  --fg:#e8eef3; --muted:#9aa8b4; --accent:#4cc3b2; --accent-fg:#06201c;
  --walk:#9aa8b4; --car:#7ea6ff; --transit:#ff7a6e; --warn:#f0a44b; --ok:#5fd08a; --bad:#ff7a6e;
  --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171c; --surface:#1a2228; --surface-2:#232d35; --line:#33404a;
  --fg:#e8eef3; --muted:#9aa8b4; --accent:#4cc3b2; --accent-fg:#06201c;
  --walk:#9aa8b4; --car:#7ea6ff; --transit:#ff7a6e; --warn:#f0a44b; --ok:#5fd08a; --bad:#ff7a6e;
  --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

#map{position:fixed;inset:0;z-index:0;background:var(--surface-2)}
.leaflet-container{font:inherit;background:var(--surface-2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .leaflet-tile-pane{filter:brightness(.72) contrast(1.15) saturate(.7) invert(1) hue-rotate(180deg)}}
:root[data-theme="dark"] .leaflet-tile-pane{filter:brightness(.72) contrast(1.15) saturate(.7) invert(1) hue-rotate(180deg)}
.leaflet-control-attribution{font-size:10px;background:color-mix(in srgb,var(--surface) 85%,transparent)!important;color:var(--muted)}
.leaflet-control-attribution a{color:var(--accent)}
.leaflet-bottom{bottom:calc(var(--sheet-h) + 4px)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.leaflet-popup-content{margin:12px 44px 12px 14px}
.leaflet-container a.leaflet-popup-close-button{width:36px;height:36px;top:4px;right:4px;display:grid;place-items:center;font:400 26px/1 var(--f-body);color:var(--muted);border-radius:10px}
.leaflet-container a.leaflet-popup-close-button:hover,.leaflet-container a.leaflet-popup-close-button:focus-visible{color:var(--fg);background:var(--surface-2)}

/* Pannello di ricerca */
#top{position:fixed;left:0;right:0;top:0;z-index:20;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);pointer-events:auto}
#search{padding:10px;display:grid;gap:8px;max-width:560px;margin:0 auto}
.fields{display:grid;grid-template-columns:auto 1fr auto;gap:6px 8px;align-items:center}
.dots{grid-row:1/3;display:flex;flex-direction:column;align-items:center;gap:3px;padding:0 2px}
.dots i{width:10px;height:10px;border-radius:50%;border:2.5px solid var(--accent)}
.dots i:last-child{background:var(--fg);border-color:var(--fg);border-radius:2px}
.dots b{width:2px;height:16px;background:var(--line)}
.field{position:relative;min-width:0}
.field input::-webkit-search-cancel-button{display:none}
.field input{width:100%;height:42px;border:0;border-radius:10px;background:var(--surface-2);padding:0 36px 0 12px;outline:none}
.field input:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.field .clear{position:absolute;right:4px;top:5px;width:32px;height:32px;border:0;background:none;color:var(--muted);border-radius:8px}
#swap{grid-row:1/3;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.modes{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;flex:1 1 auto;min-width:0}
.modes button{flex:1;border:0;background:none;border-radius:9px;height:36px;display:flex;gap:6px;align-items:center;justify-content:center;color:var(--muted);font-weight:700;white-space:nowrap}
.modes button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.modes svg{width:18px;height:18px}
.when{display:flex;gap:6px;align-items:center;flex:1 1 100%;min-width:0}
.when select,.when input{height:36px;border:0;border-radius:10px;background:var(--surface-2);padding:0 8px;min-width:0}
.when select{flex:0 0 auto}
.when input{flex:1}

#sugg{max-width:560px;margin:6px auto 0;overflow:hidden;max-height:min(55vh,420px);overflow-y:auto}
#sugg button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-bottom:1px solid var(--line)}
#sugg button:last-child{border-bottom:0}
#sugg button:active{background:var(--surface-2)}
.sicon{flex:0 0 32px;height:32px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.sicon svg{width:18px;height:18px}
.stext{min-width:0}
.stext b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stext small{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Pulsante posizione */
#locate{position:fixed;z-index:15;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(var(--sheet-h) + 34px);width:46px;height:46px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--accent);transition:bottom .25s}
#locate svg{width:22px;height:22px}

/* Foglio inferiore */
#sheet{position:fixed;z-index:10;left:0;right:0;bottom:0;height:var(--sheet-h);background:var(--surface);border-radius:20px 20px 0 0;box-shadow:0 -6px 24px rgba(20,32,43,.16);display:flex;flex-direction:column;transition:height .25s ease;max-width:640px;margin:0 auto}
#sheet.dragging{transition:none}
#handle{flex:0 0 auto;padding:8px 0 4px;touch-action:none;cursor:grab}
#handle i{display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
#sheetHead{display:flex;align-items:center;gap:8px;padding:2px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));touch-action:none}
#sheetHead h2{font:700 20px/1.15 var(--f-sign);letter-spacing:.01em;margin:0;flex:1;min-width:0;text-wrap:balance}
#back{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface-2);display:grid;place-items:center}
#sheetBody{flex:1;overflow-y:auto;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(16px,env(safe-area-inset-left,0px));overscroll-behavior:contain}
@media (min-width:900px){#sheet{left:12px;right:auto;width:420px;margin:0;top:auto}}

.muted{color:var(--muted)}
.small{font-size:13px}
.empty{padding:14px 0;color:var(--muted)}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px;font-weight:700}
.list{display:grid;gap:8px}
.btn{border:0;border-radius:12px;padding:10px 14px;background:var(--surface-2);font-weight:700}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.small{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.wide{width:100%}
a.btn{display:inline-block;text-decoration:none;color:var(--fg)}

/* Risultati */
.itin{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);text-align:left;width:100%;display:grid;gap:8px}
.itin:active{background:var(--surface-2)}
.itin .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.times{font:700 22px/1 var(--f-sign);font-variant-numeric:tabular-nums}
.dur{font:600 18px/1 var(--f-sign);white-space:nowrap}
.chain{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.chain .sep{color:var(--line)}
.chip{display:inline-flex;align-items:center;gap:3px;border-radius:6px;padding:2px 7px;font:700 15px/1.25 var(--f-sign);letter-spacing:.02em;background:var(--transit);color:#fff;white-space:nowrap}
.chip svg{width:14px;height:14px}
.chip.walk{background:var(--surface-2);color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted)}
.rt{color:var(--ok);font-weight:700}
.late{color:var(--warn);font-weight:700}
.cancel{color:var(--bad);font-weight:700;text-decoration:line-through}

/* Dettaglio */
.tl{position:relative;display:grid;gap:0}
.stop{display:grid;grid-template-columns:52px 22px 1fr;align-items:start;gap:0 8px}
.stop .t{font:700 17px/1.3 var(--f-sign);text-align:right;font-variant-numeric:tabular-nums}
.stop .t small{display:block;font:400 12px/1.2 var(--f-body)}
.stop .n{min-width:0;padding-bottom:2px}
.stop .n b{display:block}
.node{width:14px;height:14px;border-radius:50%;border:3px solid var(--c,var(--fg));background:var(--surface);margin:3px auto 0;position:relative;z-index:1}
.seg{display:grid;grid-template-columns:52px 22px 1fr;gap:0 8px;min-height:30px}
.seg .bar{width:6px;margin:0 auto;background:var(--c,var(--walk));border-radius:3px}
.seg .bar.dash{background:none;border-left:4px dotted var(--c,var(--walk));width:0}
.seg .body{padding:8px 0 12px;min-width:0;display:grid;gap:6px}
details summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:14px;list-style:none}
details summary::-webkit-details-marker{display:none}
.mini{display:grid;gap:4px;margin-top:6px;font-size:13px}
.mini div{display:flex;gap:8px}
.mini span:first-child{font-variant-numeric:tabular-nums;color:var(--muted);min-width:40px}
.steps{display:grid;gap:6px;margin:6px 0 0;padding:0;list-style:none;font-size:14px}
.steps li{display:flex;gap:8px;justify-content:space-between}
.steps li span:last-child{color:var(--muted);white-space:nowrap}

/* Partenze */
.dep{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);width:100%;border-left:0;border-right:0;border-top:0;background:none;text-align:left}
.dep .in{font:700 20px/1 var(--f-sign);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dep .in small{display:block;font:400 12px/1.3 var(--f-body);color:var(--muted)}
.dep .hs{min-width:0}
.dep .hs b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.recent{display:flex;gap:10px;align-items:center;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left}
.err{background:color-mix(in srgb,var(--bad) 12%,var(--surface));border-radius:12px;padding:12px;margin:8px 0}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;margin:18px auto}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:2s!important}}

.pin{width:18px;height:18px;border-radius:50%;border:4px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pin.from{background:var(--accent)} .pin.to{background:var(--fg);border-radius:4px}
.me{width:16px;height:16px;border-radius:50%;background:#2a7bff;border:3px solid #fff;box-shadow:0 0 0 6px rgba(42,123,255,.25)}
.popbtns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sheet-h) + 90px);z-index:40;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:12px;max-width:90vw;font-size:14px}

/* Avviso offline */
.netpill{max-width:560px;margin:6px auto 0;background:var(--fg);color:var(--bg);border-radius:12px;padding:8px 12px;font-size:13px;pointer-events:auto;box-shadow:var(--shadow)}
body.navigating .netpill{display:none}

/* Schede della schermata iniziale */
.tabs{display:flex;gap:4px;background:var(--surface-2);border-radius:12px;padding:3px;margin:0 0 8px}
.tabs button{flex:1;border:0;background:none;border-radius:9px;height:34px;font-weight:700;color:var(--muted);font-size:14px;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.rowitem{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line)}
.rowitem .recent{border-bottom:0;flex:1;min-width:0}
.iconbtn{flex:0 0 40px;height:40px;border:0;background:none;border-radius:10px;color:var(--muted);display:grid;place-items:center}

/* Navigazione */
body.navigating #top,body.navigating #sheet,body.navigating #locate{display:none}
body.navigating .leaflet-bottom{bottom:calc(env(safe-area-inset-bottom,0px) + 96px)}
#nav{position:fixed;z-index:30;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.navcard{max-width:560px;margin:0 auto;background:var(--accent);color:var(--accent-fg);border-radius:18px;padding:14px 16px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow)}
#navIcon{flex:0 0 auto;min-width:52px;display:grid;place-items:center}
#navIcon svg{width:48px;height:48px}
#navIcon .chip{font-size:20px;padding:4px 10px}
#navIcon .chip svg{width:18px;height:18px}
.navtext{min-width:0}
#navDist{font:700 30px/1.05 var(--f-sign);font-variant-numeric:tabular-nums}
#navInstr{font:700 18px/1.25 var(--f-body);text-wrap:balance}
#navThen{opacity:.85;margin-top:3px}
#navThen:empty{display:none}
#navBar{position:fixed;z-index:30;left:0;right:0;bottom:0;background:var(--surface);box-shadow:0 -6px 24px rgba(20,32,43,.16);border-radius:20px 20px 0 0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
#navSummary{flex:1;min-width:0;font:600 18px/1.2 var(--f-sign);font-variant-numeric:tabular-nums}
.navbtns{display:flex;gap:8px;align-items:center}
.navbtns button{height:44px;min-width:44px;border:0;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-weight:700}
#navStop{background:var(--bad);color:#fff;padding:0 16px}
</style>
</head>
<body>
<section id="map" aria-label="Mappa"></section>

<div id="top">
  <form id="search" class="card" autocomplete="off" onsubmit="return false">
    <div class="fields">
      <div class="dots" aria-hidden="true"><i></i><b></b><i></i></div>
      <div class="field"><input id="from" type="search" placeholder="Partenza" aria-label="Partenza" enterkeyhint="next"><button type="button" class="clear" data-clear="from" aria-label="Cancella partenza" hidden>✕</button></div>
      <button type="button" id="swap" aria-label="Inverti partenza e arrivo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg></button>
      <div class="field"><input id="to" type="search" placeholder="Arrivo" aria-label="Arrivo" enterkeyhint="search"><button type="button" class="clear" data-clear="to" aria-label="Cancella arrivo" hidden>✕</button></div>
    </div>
    <div class="row">
      <div class="modes" role="group" aria-label="Mezzo">
        <button type="button" data-mode="TRANSIT" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="15" rx="3"/><path d="M5 11h14M8 21l1-3M16 21l-1-3"/><circle cx="8.5" cy="14.5" r=".8" fill="currentColor"/><circle cx="15.5" cy="14.5" r=".8" fill="currentColor"/></svg>Mezzi</button>
        <button type="button" data-mode="CAR" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 16v-4l2-5h12l2 5v4z"/><path d="M4 12h16"/><circle cx="7.5" cy="16.5" r="1.8"/><circle cx="16.5" cy="16.5" r="1.8"/></svg>Auto</button>
        <button type="button" data-mode="WALK" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="13" cy="4" r="2"/><path d="M11 21l2-6-3-3 1-5 4 3 3 1M10 12l-3 2"/></svg>A piedi</button>
      </div>
      <div class="when">
        <select id="whenMode" aria-label="Quando">
          <option value="now">Parti ora</option>
          <option value="depart">Parti alle</option>
          <option value="arrive">Arriva entro</option>
        </select>
        <input id="whenTime" type="datetime-local" aria-label="Data e ora" hidden>
      </div>
    </div>
    <button type="submit" hidden>Cerca</button>
  </form>
  <div id="sugg" class="card" aria-live="polite" hidden></div>
  <div id="net" class="netpill" role="status" hidden>Sei offline · la mappa mostra le zone già viste, orari e percorsi tornano con la rete</div>
</div>

<button id="locate" type="button" aria-label="La mia posizione"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>

<section id="sheet" aria-label="Pannello">
  <div id="handle" aria-hidden="true"><i></i></div>
  <div id="sheetHead"><button id="back" type="button" aria-label="Indietro" hidden><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button><h2 id="sheetTitle">Dove vuoi andare?</h2></div>
  <div id="sheetBody"></div>
</section>


<div id="nav" hidden><div class="navcard" role="status" aria-live="polite"><div id="navIcon"></div><div class="navtext"><div id="navDist"></div><div id="navInstr"></div><div id="navThen" class="small"></div></div></div></div>
<div id="navBar" hidden>
  <div id="navSummary"></div>
  <div class="navbtns">
    <button type="button" id="navCenter" aria-label="Torna alla mia posizione" hidden><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
    <button type="button" id="navVoice" aria-label="Voce"></button>
    <button type="button" id="navStop">Fine</button>
  </div>
</div>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
