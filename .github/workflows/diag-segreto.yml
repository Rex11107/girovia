name: Diagnosi segreto APK

# Dice solo SE il segreto APK_KEY_PASS arriva ai workflow, e da quale sezione.
# Non stampa mai il valore.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - env: { P: "${{ secrets.APK_KEY_PASS }}" }
        run: if [ -n "$P" ]; then echo "::notice::Segreto di repository PRESENTE (${#P} caratteri)"; else echo "::warning::Segreto di repository ASSENTE"; fi
  ambiente-github-pages:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - env: { P: "${{ secrets.APK_KEY_PASS }}" }
        run: if [ -n "$P" ]; then echo "::notice::Segreto nell'ambiente github-pages PRESENTE (${#P} caratteri)"; else echo "::warning::Segreto nell'ambiente github-pages ASSENTE"; fi
