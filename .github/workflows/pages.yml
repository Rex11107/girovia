name: Pubblica su GitHub Pages

# Copia i file dell'app nel ramo gh-pages, da cui GitHub Pages pubblica il sito
# su https://rex11107.github.io/girovia/

on:
  push:
    branches: [main]
    paths-ignore: ["tests/**", "README.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copia l'app nel ramo gh-pages
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/site
          cp index.html app.js config.js manifest.webmanifest icon.svg icon-192.png icon-512.png LICENSE /tmp/site/
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Pubblica ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" gh-pages
