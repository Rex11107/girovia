name: APK Android

# Compila l'app Android (Capacitor) con l'app web dentro, la firma con la chiave
# del progetto e la pubblica tra le Release:
# https://github.com/Rex11107/girovia/releases/latest/download/girovia.apk

on:
  push:
    branches: [main]
    paths: ["index.html", "styles.css", "theme.js", "js/**", "config.js", "privacy.html", "sw.js", "manifest.webmanifest", "icon*", "vendor/**", "fonts/**", "scripts/**", "capacitor.config.json", "android-src/**", "package.json", "CHANGELOG.md", ".github/workflows/apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: File dell'app web
        run: |
          scripts/copy-app.sh www "${{ github.sha }}"
          # Nell'APK Capacitor può inserire nella pagina uno script inline per il collegamento
          # con il telefono: la Content-Security-Policy lo deve permettere.
          sed -i "s/script-src 'self';/script-src 'self' 'unsafe-inline';/" www/index.html
          grep -q "script-src 'self' 'unsafe-inline';" www/index.html
      - name: Versione
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "::notice::La versione $V è già pubblicata: compilo per verifica, senza nuova release. Per pubblicare aggiorna version in package.json e CHANGELOG.md."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            scripts/release-notes.sh "$V" > notes.md
            if [ ! -s notes.md ]; then echo "::error::Manca la sezione [$V] in CHANGELOG.md"; exit 1; fi
          fi
      - name: Progetto Android
        run: |
          npx cap add android
          android-src/prepare.sh ${{ github.run_number }} ${{ steps.ver.outputs.version }}
          npx cap sync android
      - name: Compila
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
      - name: Firma e verifica dell'impronta
        env:
          APK_KEY_PASS: ${{ secrets.APK_KEY_PASS }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${APK_KEY_PASS}" ]; then echo "::error::Manca il segreto APK_KEY_PASS"; exit 1; fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android-src/release.p12.enc -out "$RUNNER_TEMP/k.p12" -pass env:APK_KEY_PASS
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -f -p 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/k.p12" --ks-type PKCS12 --ks-pass env:APK_KEY_PASS --ks-key-alias girovia --out girovia.apk aligned.apk
          rm -f "$RUNNER_TEMP/k.p12"
          # La firma deve essere valida e fatta con la chiave del progetto: altrimenti gli aggiornamenti non si installano
          "$BT/apksigner" verify --verbose --print-certs girovia.apk > verify.txt
          GOT=$(grep -m1 "certificate SHA-256 digest" verify.txt | awk '{print $NF}' | tr 'A-F' 'a-f')
          WANT=$(tr -d '[:space:]' < android-src/expected-cert-sha256.txt)
          echo "Impronta firma: $GOT"
          if [ "$GOT" != "$WANT" ]; then echo "::error::Impronta della firma diversa da quella attesa ($WANT)"; exit 1; fi
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" verify.txt
          ls -l girovia.apk
      - name: Pubblica nelle Release
        if: steps.ver.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          { cat notes.md; echo; echo "---"; echo "APK per Android: scaricalo dal telefono, aprilo e consenti l'installazione da questa fonte. Si installa sopra la versione precedente."; } > body.md
          gh release create "v$V" girovia.apk --target "${{ github.sha }}" --latest --title "Girovia $V" --notes-file body.md
      - name: Tieni solo le ultime 10 release
        if: steps.ver.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[10:] | .[].tagName' |
            while read -r T; do echo "Tolgo la release $T"; gh release delete "$T" --cleanup-tag --yes; done
