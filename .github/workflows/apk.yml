name: APK Android

# Compila l'app Android (Capacitor) con l'app web dentro, la firma con la chiave
# del progetto e la pubblica tra le Release:
# https://github.com/Rex11107/girovia/releases/latest/download/girovia.apk

on:
  push:
    branches: [main]
    paths: ["index.html", "app.js", "config.js", "manifest.webmanifest", "icon*", "capacitor.config.json", "android-src/**", ".github/workflows/apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: File dell'app web
        run: |
          mkdir -p www
          cp index.html app.js config.js manifest.webmanifest icon.svg icon-192.png icon-512.png www/
      - name: Progetto Android
        run: |
          npx cap add android
          android-src/prepare.sh ${{ github.run_number }}
          npx cap sync android
      - name: Compila
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
      - name: Firma
        env:
          APK_KEY_PASS: ${{ secrets.APK_KEY_PASS }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${APK_KEY_PASS}" ]; then echo "::error::Manca il segreto APK_KEY_PASS"; exit 1; fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android-src/release.p12.enc -out "$RUNNER_TEMP/k.p12" -pass env:APK_KEY_PASS
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -f -p 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/k.p12" --ks-type PKCS12 --ks-pass env:APK_KEY_PASS --ks-key-alias girovia --out girovia.apk aligned.apk
          "$BT/apksigner" verify --print-certs girovia.apk | grep -i "SHA-256"
          rm -f "$RUNNER_TEMP/k.p12"
          ls -l girovia.apk
      - name: Pubblica nelle Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.${{ github.run_number }}"
          gh release create "$TAG" girovia.apk --target "${{ github.sha }}" --latest \
            --title "Girovia 0.1.${{ github.run_number }}" \
            --notes "APK per Android. Scaricalo dal telefono, aprilo e consenti l'installazione da questa fonte. Gli aggiornamenti si installano sopra la versione precedente."
